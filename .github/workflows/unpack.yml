name: Unpack Slice
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ZIP_FILE=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in repo root!"
            exit 1
          fi
          echo "Found $ZIP_FILE"
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' ! -name "$ZIP_FILE" -exec rm -rf {} +
          unzip -o "$ZIP_FILE"
          rm -f "$ZIP_FILE"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Slice 1: Clean folder structure"
          git push
          
